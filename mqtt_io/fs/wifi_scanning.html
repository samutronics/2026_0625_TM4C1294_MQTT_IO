<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanning...</title>
  <meta http-equiv="refresh" content="7;url=index.shtml#set-wifi">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .scanner {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #cc0000;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .scanner h1 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 24px;
    }
    .scanner p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }
    .scanner p.info {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="scanner">
    <div class="spinner"></div>
    <h1>Scanning Networks</h1>
    <p>Please wait while the device searches for available WiFi networks...</p>
    <p class="info">The page will automatically refresh in 7 seconds.</p>
  </div>
</body>
</html>
